name: Deploy paper library to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Keep one deployment at a time; let the running deployment finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static library
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: utils/requirements.txt

      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check -r utils/requirements.txt

      - name: Build and validate
        run: |
          python utils/build.py --strict
          # Static artifact; Jekyll processing is not needed.
          touch papers/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Creates the Pages site with "GitHub Actions" as the source when possible.
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: papers
          retention-days: 1

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
