  <text x="0" y="286" fill="#8fb8b1" font-family="'Noto Sans CJK SC',sans-serif" font-size="13">2–4× higher throughput at the same latency · memory waste &lt; 4%</text>
</g>
</g>
  <text x="1130" y="846" fill="#5f837d" font-family="'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="15" font-weight="600" letter-spacing="2" text-anchor="end">FOUNDATIONAL PAPER</text>
