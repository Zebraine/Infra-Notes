      <rect x="598" y="84" width="96" height="42" rx="6" fill="#0d1b19" stroke="#5eead4" stroke-opacity="0.3"/><text x="646" y="110" fill="#5f837d" font-size="11" text-anchor="middle">page 6</text>
      <rect x="706" y="84" width="96" height="42" rx="6" fill="#f0a44a" opacity="0.65" stroke="#f0a44a"/><text x="754" y="110" fill="#0b1717" font-size="11" font-weight="700" text-anchor="middle">page 7 ★</text>
      <rect x="814" y="84" width="96" height="42" rx="6" fill="#0d1b19" stroke="#5eead4" stroke-opacity="0.3"/><text x="862" y="110" fill="#5f837d" font-size="11" text-anchor="middle">page 8</text>
