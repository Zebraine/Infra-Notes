<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="vLLM 封面：分页 KV 缓存与逻辑块表">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1515"/>
      <stop offset="0.52" stop-color="#0d1d1b"/>
      <stop offset="1" stop-color="#122a27"/>
    </linearGradient>
    <radialGradient id="glow" cx="18%" cy="8%" r="85%">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.22"/>
      <stop offset="0.58" stop-color="#2dd4bf" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7ff5e4" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#5eead4" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#5eead4"/>
    </marker>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#glow)"/>
  <rect width="1200" height="900" fill="url(#grid)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accentLine)"/>
  <text x="70" y="82" fill="#8fb8b1" font-family="'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="18" font-weight="600" letter-spacing="4">AI INFRA · FOUNDATIONS</text>
  <text x="70" y="236" fill="#f2fbf9" font-family="'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="132" font-weight="800" letter-spacing="-3">vLLM</text>
  <text x="72" y="282" fill="#c6ded9" font-family="'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="26" font-weight="400">Efficient Memory Management for</text>
  <text x="72" y="316" fill="#c6ded9" font-family="'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="26" font-weight="400">Large Language Model Serving with PagedAttention</text>
  <text x="72" y="410" fill="#9bbdb8" font-family="'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="19" font-weight="500">Kwon · Li · Zhuang · Sheng · Zheng · Yu · Gonzalez · Zhang · Stoica</text>
  <text x="72" y="444" fill="#5eead4" font-family="'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="18" font-weight="700" letter-spacing="1.2">SOSP · 2023</text>
