abstract: >-
  Position encoding recently has shown effective in the transformer architecture. It enables
  valuable supervision for dependency modeling between elements at different positions of the
  sequence. In this paper, we first investigate various methods to integrate positional information
  into the learning process of transformer-based language models. Then, we propose a novel method
  named Rotary Position Embedding (RoPE) to effectively leverage the positional information.
  Specifically, the proposed RoPE encodes the absolute position with a rotation matrix and
  meanwhile incorporates the explicit relative position dependency in self-attention formulation.
  Notably, RoPE enables valuable properties, including the flexibility of sequence length,
  decaying inter-token dependency with increasing relative distances, and the capability of
  equipping the linear self-attention with relative position encoding. Finally, we evaluate the
  enhanced transformer with rotary position embedding, also called RoFormer, on various long text
  classification benchmark datasets. Our experiments show that it consistently overcomes its
  alternatives. Furthermore, we provide a theoretical analysis to explain some experimental
  results.
abstract_zh: >-
  位置编码近来在 Transformer 架构中展现出有效性，它为序列中不同位置元素之间的依赖建模提供了
  有价值的监督信号。本文首先梳理了把位置信息融入 Transformer 语言模型学习过程的各种方法，然后
  提出一种新方法——旋转位置嵌入（RoPE），以有效利用位置信息。具体而言，RoPE 用旋转矩阵编码
  绝对位置，同时在自注意力公式中显式引入相对位置依赖。值得注意的是，RoPE 具有若干有价值的性质：
  序列长度上的灵活性、token 间依赖随相对距离增大而衰减，以及为线性自注意力配备相对位置编码的
  能力。最后，我们在多个长文本分类基准上评估了使用旋转位置嵌入增强的 Transformer（RoFormer）。
  实验表明，它稳定优于替代方案；我们还提供理论分析来解释部分实验结果。RoFormer 已集成到
  Hugging Face Transformers。
summary: >-
  用旋转矩阵把绝对位置写进 query/key，使内积自然只依赖相对距离；RoPE 由此成为现代 LLM
  位置编码的事实标准。
