<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="ZeRO 封面：优化器状态、梯度与参数分片">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1515"/>
      <stop offset="0.52" stop-color="#0d1d1b"/>
      <stop offset="1" stop-color="#122a27"/>
    </linearGradient>
    <radialGradient id="glow" cx="18%" cy="8%" r="85%">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.22"/>
      <stop offset="0.58" stop-color="#2dd4bf" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7ff5e4" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#5eead4" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#5eead4"/>
    </marker>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#glow)"/>
  <rect width="1200" height="900" fill="url(#grid)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accentLine)"/>
  <text x="70" y="82" fill="#8fb8b1" font-family="'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="18" font-weight="600" letter-spacing="4">AI INFRA · FOUNDATIONS</text>
  <text x="70" y="236" fill="#f2fbf9" font-family="'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="132" font-weight="800" letter-spacing="-3">ZeRO</text>
  <text x="72" y="282" fill="#c6ded9" font-family="'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="26" font-weight="400">Memory Optimizations Toward</text>
  <text x="72" y="316" fill="#c6ded9" font-family="'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="26" font-weight="400">Training Trillion Parameter Models</text>
  <text x="72" y="410" fill="#9bbdb8" font-family="'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="19" font-weight="500">Rajbhandari · Rasley · Ruwase · He</text>
  <text x="72" y="444" fill="#5eead4" font-family="'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="18" font-weight="700" letter-spacing="1.2">SC20 · 2020</text>
  <g transform="translate(70 500)">
<g opacity="0.95">
  <text x="0" y="18" fill="#5eead4" font-family="'Noto Sans CJK SC',sans-serif" font-size="15" font-weight="700" letter-spacing="2">PARTITION MODEL STATES</text>
  <g transform="translate(0 46)">
    <text x="0" y="16" fill="#8fb8b1" font-family="'Noto Sans CJK SC',sans-serif" font-size="13">baseline data parallel</text>
    <rect x="0" y="26" width="1060" height="52" rx="8" fill="#0e2723" stroke="#5eead4" stroke-opacity="0.35"/>
    <rect x="0" y="26" width="636" height="52" rx="8" fill="#1c4a43"/>
    <rect x="636" y="26" width="212" height="52" fill="#2d6a5f"/>
    <rect x="848" y="26" width="212" height="52" rx="8" fill="#f0a44a" opacity="0.55"/>
    <text x="318" y="58" fill="#d7fff8" font-family="'Noto Sans CJK SC',sans-serif" font-size="15" font-weight="700" text-anchor="middle">optimizer states</text>
    <text x="742" y="58" fill="#d7fff8" font-family="'Noto Sans CJK SC',sans-serif" font-size="15" font-weight="700" text-anchor="middle">grads</text>
    <text x="954" y="58" fill="#0b1717" font-family="'Noto Sans CJK SC',sans-serif" font-size="15" font-weight="700" text-anchor="middle">params</text>
    <text x="0" y="108" fill="#5eead4" font-family="'Noto Sans CJK SC',sans-serif" font-size="13">ZeRO-DP: same states, partitioned across N_d workers</text>
    <rect x="0" y="122" width="1060" height="52" rx="8" fill="#0e2723" stroke="#5eead4" stroke-opacity="0.35"/>
    <g fill="#1c4a43">
      <rect x="0" y="122" width="106" height="52" rx="7"/><rect x="106" y="122" width="106" height="52" rx="7"/><rect x="212" y="122" width="106" height="52" rx="7"/><rect x="318" y="122" width="106" height="52" rx="7"/><rect x="424" y="122" width="106" height="52" rx="7"/><rect x="530" y="122" width="106" height="52" rx="7"/><rect x="636" y="122" width="106" height="52" rx="7"/><rect x="742" y="122" width="106" height="52" rx="7"/><rect x="848" y="122" width="106" height="52" rx="7"/><rect x="954" y="122" width="106" height="52" rx="7"/>
    </g>
    <g fill="#8fb8b1" font-family="'Noto Sans CJK SC',sans-serif" font-size="11" text-anchor="middle">
      <text x="53" y="153">P₀</text><text x="159" y="153">P₁</text><text x="265" y="153">P₂</text><text x="371" y="153">P₃</text><text x="477" y="153">P₄</text><text x="583" y="153">P₅</text><text x="689" y="153">P₆</text><text x="795" y="153">P₇</text><text x="901" y="153">P₈</text><text x="1007" y="153">P₉</text>
    </g>
  </g>
  <text x="0" y="226" fill="#d7fff8" font-family="'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="600">P_os: 4×    P_os+g: 8×    P_os+g+p: N_d× memory reduction</text>
  <text x="0" y="256" fill="#8fb8b1" font-family="'Noto Sans CJK SC',sans-serif" font-size="13">trillion-parameter model state ≈ 16 TB → 1024 GPUs × 16 GB</text>
  <text x="0" y="286" fill="#8fb8b1" font-family="'Noto Sans CJK SC',sans-serif" font-size="13">170B with MP · 13B with data parallelism alone · 15 PFLOPs</text>
</g>
</g>
  <text x="1130" y="846" fill="#5f837d" font-family="'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="15" font-weight="600" letter-spacing="2" text-anchor="end">FOUNDATIONAL PAPER</text>
</svg>
