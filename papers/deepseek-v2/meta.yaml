abstract: >-
  We present DeepSeek-V2, a strong Mixture-of-Experts (MoE) language model characterized by
  economical training and efficient inference. It comprises 236B total parameters, of which 21B
  are activated for each token, and supports a context length of 128K tokens. DeepSeek-V2 adopts
  innovative architectures including Multi-head Latent Attention (MLA) and DeepSeekMoE. MLA
  guarantees efficient inference through significantly compressing the Key-Value (KV) cache into
  a latent vector, while DeepSeekMoE enables training strong models at an economical cost through
  sparse computation. Compared with DeepSeek 67B, DeepSeek-V2 achieves significantly stronger
  performance, and meanwhile saves 42.5% of training costs, reduces the KV cache by 93.3%, and
  boosts the maximum generation throughput to 5.76 times. We pretrain DeepSeek-V2 on a
  high-quality and multi-source corpus consisting of 8.1T tokens, and further perform Supervised
  Fine-Tuning (SFT) and Reinforcement Learning (RL) to fully unlock its potential. Evaluation
  results show that, even with only 21B activated parameters, DeepSeek-V2 and its chat versions
  still achieve top-tier performance among open-source models.
abstract_zh: >-
  DeepSeek-V2 是一个强大的混合专家（MoE）语言模型，以经济的训练和高效的推理为特征。它总参数量为
  236B，每个 token 激活 21B，支持 128K 的上下文长度。DeepSeek-V2 采用多头潜变量注意力（MLA）与
  DeepSeekMoE 等创新架构：MLA 通过把键值（KV）缓存显著压缩为潜向量来保证高效推理，DeepSeekMoE
  则通过稀疏计算以经济成本训练强模型。与 DeepSeek 67B 相比，DeepSeek-V2 性能显著更强，同时节省
  42.5% 的训练成本、将 KV 缓存减少 93.3%，并把最大生成吞吐提升至 5.76 倍。我们在 8.1T token 的
  高质量多源语料上预训练 DeepSeek-V2，并通过监督微调（SFT）与强化学习（RL）充分释放其潜力。
  评估结果表明，即使只有 21B 激活参数，DeepSeek-V2 及其对话版本仍在开源模型中达到顶级水平。
summary: >-
  用低秩联合压缩把 KV 缓存压成潜向量，并用解耦 RoPE 保持位置信息；MLA 让 236B/21B 的 MoE
  模型在 128K 上下文下仍能高效推理。
