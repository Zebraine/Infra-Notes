<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Orca 封面：迭代级调度与连续批处理">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1515"/>
      <stop offset="0.52" stop-color="#0d1d1b"/>
      <stop offset="1" stop-color="#122a27"/>
    </linearGradient>
    <radialGradient id="glow" cx="18%" cy="8%" r="85%">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.22"/>
      <stop offset="0.58" stop-color="#2dd4bf" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7ff5e4" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#5eead4" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#5eead4"/>
    </marker>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#glow)"/>
  <rect width="1200" height="900" fill="url(#grid)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accentLine)"/>
  <text x="70" y="82" fill="#8fb8b1" font-family="'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="18" font-weight="600" letter-spacing="4">AI INFRA · FOUNDATIONS</text>
  <text x="70" y="236" fill="#f2fbf9" font-family="'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="132" font-weight="800" letter-spacing="-3">Orca</text>
  <text x="72" y="282" fill="#c6ded9" font-family="'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="26" font-weight="400">A Distributed Serving System for</text>
  <text x="72" y="316" fill="#c6ded9" font-family="'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="26" font-weight="400">Transformer-Based Generative Models</text>
  <text x="72" y="410" fill="#9bbdb8" font-family="'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="19" font-weight="500">Yu · Jeong · Kim · Kim · Chun</text>
  <text x="72" y="444" fill="#5eead4" font-family="'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="18" font-weight="700" letter-spacing="1.2">OSDI · 2022</text>
  <g transform="translate(70 500)">
<g opacity="0.95">
  <text x="0" y="18" fill="#5eead4" font-family="'Noto Sans CJK SC',sans-serif" font-size="15" font-weight="700" letter-spacing="2">ITERATION-LEVEL SCHEDULING</text>
  <g transform="translate(0 46)">
    <g stroke="#5eead4" stroke-opacity="0.18">
      <path d="M0 0 V220"/><path d="M106 0 V220"/><path d="M212 0 V220"/><path d="M318 0 V220"/><path d="M424 0 V220"/><path d="M530 0 V220"/><path d="M636 0 V220"/><path d="M742 0 V220"/><path d="M848 0 V220"/><path d="M954 0 V220"/><path d="M1060 0 V220"/>
    </g>
    <g font-family="'Noto Sans CJK SC',sans-serif" font-size="12" fill="#8fb8b1">
      <text x="8" y="14">request-level batch</text>
      <text x="8" y="128">iteration-level batch</text>
    </g>
    <g>
      <rect x="0" y="28" width="636" height="34" rx="6" fill="#1c4a43"/><text x="318" y="50" fill="#d7fff8" font-size="13" font-weight="600" text-anchor="middle">A runs to completion</text>
      <rect x="636" y="28" width="212" height="34" rx="6" fill="#2d6a5f"/><text x="742" y="50" fill="#d7fff8" font-size="13" font-weight="600" text-anchor="middle">B</text>
      <rect x="848" y="28" width="212" height="34" rx="6" fill="#f0a44a" opacity="0.55"/><text x="954" y="50" fill="#0b1717" font-size="13" font-weight="700" text-anchor="middle">C waits</text>
    </g>
    <g>
      <rect x="0" y="142" width="212" height="28" rx="6" fill="#1c4a43"/><text x="106" y="161" fill="#d7fff8" font-size="12" font-weight="600" text-anchor="middle">A · iter 1</text>
      <rect x="212" y="142" width="212" height="28" rx="6" fill="#2d6a5f"/><text x="318" y="161" fill="#d7fff8" font-size="12" font-weight="600" text-anchor="middle">B · iter 1</text>
      <rect x="424" y="142" width="212" height="28" rx="6" fill="#f0a44a" opacity="0.6"/><text x="530" y="161" fill="#0b1717" font-size="12" font-weight="700" text-anchor="middle">C · iter 1</text>
      <rect x="636" y="142" width="212" height="28" rx="6" fill="#1c4a43"/><text x="742" y="161" fill="#d7fff8" font-size="12" font-weight="600" text-anchor="middle">A · iter 2</text>
      <rect x="848" y="142" width="106" height="28" rx="6" fill="#2d6a5f"/><text x="901" y="161" fill="#d7fff8" font-size="12" font-weight="600" text-anchor="middle">B</text>
      <rect x="954" y="142" width="106" height="28" rx="6" fill="#f0a44a" opacity="0.6"/><text x="1007" y="161" fill="#0b1717" font-size="12" font-weight="700" text-anchor="middle">C</text>
    </g>
    <g fill="#5eead4" font-family="'Noto Sans CJK SC',sans-serif" font-size="12">
      <text x="0" y="206">finished request returns immediately</text>
      <text x="530" y="206">new request can join after one iteration</text>
    </g>
  </g>
  <text x="0" y="288" fill="#8fb8b1" font-family="'Noto Sans CJK SC',sans-serif" font-size="13">GPT-3 175B · 36.9× throughput at the same latency · scales to 341B</text>
</g>
</g>
  <text x="1130" y="846" fill="#5f837d" font-family="'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="15" font-weight="600" letter-spacing="2" text-anchor="end">FOUNDATIONAL PAPER</text>
</svg>
